<li class="px-3 py-1" [attr.id]="'cliente-' + cliente().clave">
    <a [routerLink]="['/articulos']" [queryParams]="{ cliente: cliente().clave }"
        class="flex items-center gap-3 rounded-2xl border border-border/70 bg-card p-3 transition-all duration-200 hover:border-primary/30 hover:shadow-sm hover:shadow-primary/10 no-underline group cursor-pointer">

        <!-- Avatar con iniciales -->
        <div class="w-9.5 h-9.5 rounded-[11px] flex items-center justify-center shrink-0 text-sm font-medium"
             [ngClass]="cliente().esClienteBase ? 'bg-muted text-muted-foreground' : 'bg-primary/10 text-primary'">
            {{ getInitials(cliente()!.nombre) }}
        </div>

        <!-- Info -->
        <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-foreground truncate">
                {{ cliente()!.nombre }}
            </p>
            <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                <span class="text-[11px] font-mono text-muted-foreground bg-muted/60 px-1.5 py-0.5 rounded-md">
                    {{ cliente()!.clave }}
                </span>
                @if (cliente()!.ciudad) {
                <span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground">
                    <ng-icon name="lucideMapPin" size="12"></ng-icon>
                    {{ cliente()!.ciudad }}
                </span>
                }
                @if (cliente()!.telefono) {
                <span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground">
                    <ng-icon name="lucidePhone" size="12"></ng-icon>
                    {{ cliente()!.telefono }}
                </span>
                }
                @if (cliente().esClienteBase) {
                <span class="text-[11px] text-muted-foreground bg-muted/60 px-1.5 py-0.5 rounded-md">
                    Cliente base
                </span>
                }
            </div>
        </div>

        <!-- Acciones -->
        @if (!cliente().esClienteBase) {
        <div class="shrink-0 flex items-center gap-0.5">
            <button hlmBtn variant="ghost" size="sm"
                class="h-8 w-8 rounded-lg p-0 text-muted-foreground hover:text-foreground"
                aria-label="Editar cliente" (click)="$event.preventDefault(); $event.stopPropagation(); onEdit()">
                <ng-icon name="lucidePencil" size="16"></ng-icon>
            </button>
            <button hlmBtn variant="ghost" size="sm"
                class="h-8 w-8 rounded-lg p-0 text-muted-foreground hover:text-red-500"
                aria-label="Eliminar cliente"
                (click)="$event.preventDefault(); $event.stopPropagation(); onDelete()">
                <ng-icon name="lucideTrash" size="16"></ng-icon>
            </button>
        </div>
        }
    </a>
</li>
