<hlm-card class="w-full max-w-sm shadow-lg">
    <hlm-card-header>
        <h3 hlmCardTitle class="text-xl">Inicio de sesión</h3>
        <p hlmCardDescription>Ingrese sus credenciales para acceder al sistema</p>
    </hlm-card-header>

    <div hlmCardContent>
        <form [formGroup]="form" (ngSubmit)="onsubmit()" id="login-form">
            <div class="flex flex-col gap-4">
                <div class="grid gap-2">
                    <label hlmLabel for="username">Usuario</label>
                    <input formControlName="username" type="text" id="username" placeholder="Ej. 001250" required
                        hlmInput />
                </div>

                <div class="grid gap-2">
                    <div class="flex items-center justify-between">
                        <label hlmLabel for="password">Contraseña</label>
                    </div>
                    <div class="relative">
                        <input [type]="showPassword() ? 'text' : 'password'" id="password" required hlmInput
                            class="w-full pr-10" formControlName="password" />
                        <button type="button" (click)="togglePassword()"
                            class="absolute right-0 top-0 h-full px-3 text-muted-foreground hover:text-foreground flex items-center justify-center transition-colors focus:outline-none"
                            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                            @if (showPassword()) {
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                                <path
                                    d="M17.479 17.499A10.75 10.75 0 0 1 1.062 12.347a1 1 0 0 1 0-.695 10.748 10.748 0 0 1 4.417-5.076" />
                                <line x1="2" x2="22" y1="2" y2="22" />
                            </svg>
                            } @else {
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M2.062 12.347a12 12 0 0 1 19.876 0 1 1 0 0 1 0 .696 12 12 0 0 1-19.876 0 1 1 0 0 1 0-.696z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            }
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <hlm-card-footer class="flex-col gap-3 pt-2">
        <button hlmBtn type="submit" class="w-full" form="login-form">Ingresar</button>

        <div class="relative w-full my-1">
            <div class="absolute inset-0 flex items-center">
                <span class="w-full border-t border-border"></span>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-card px-2 text-muted-foreground">o</span>
            </div>
        </div>

        <button hlmBtn variant="outline" type="button" class="w-full" routerLink="/auth/register-device">
            Registrar Dispositivo
        </button>
    </hlm-card-footer>
</hlm-card>
