<!-- Header -->
<app-sincronizacion-header 
    [count]="items().length" 
    [isSyncing]="isSyncingAll()"
    [btStatus]="btPrinter.status()"
    [btDeviceName]="btPrinter.deviceName()"
    (sincronizarTodo)="onSincronizarTodo()"
    (conectarBT)="btPrinter.connect()"
    (desconectarBT)="btPrinter.disconnect()">
</app-sincronizacion-header>

<!-- Contenido -->
<main class="pb-32 pt-3 px-3">
    @if (isLoading()) {
    <app-sincronizacion-skeleton></app-sincronizacion-skeleton>
    } @else if (isEmpty()) {
    <app-sincronizacion-empty-state></app-sincronizacion-empty-state>
    } @else {
    <!-- Lista agrupada y redondeada en armonía con el header y bottombar -->
    <div class="rounded-2xl border border-border/70 bg-card overflow-hidden divide-y divide-border/40 shadow-xs">
        @for (item of items(); track item.id) {
        <app-sincronizacion-item 
            [item]="item" 
            [isSyncing]="syncingDocId() === item.id || isSyncingAll()"
            (descartar)="onDescartarItem($event.id!)"
            (sincronizar)="onSincronizarIndividual($event)"
            (imprimir)="onImprimirItem($event)">
        </app-sincronizacion-item>
        }
    </div>
    }
</main>
